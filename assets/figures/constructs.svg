<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img"><title>Keep three different forms of evidence distinct</title><rect width="1000" height="300" fill="#fff"/><text x="30" y="35" font-family="sans-serif" font-size="22" fill="#193d4a">Keep three different forms of evidence distinct</text><rect x="30" y="65" width="290" height="190" rx="10" fill="#e2edf1"/><text x="46" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Speaking instruction</text><text x="46" y="135" font-family="sans-serif" font-size="16">Plain / computer / listener</text><text x="46" y="163" font-family="sans-serif" font-size="16">An elicitation condition</text><text x="46" y="191" font-family="sans-serif" font-size="16">Not an outcome score</text><rect x="355" y="65" width="290" height="190" rx="10" fill="#f6eddb"/><text x="371" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Acoustic measurement</text><text x="371" y="135" font-family="sans-serif" font-size="16">Timing / pitch / level</text><text x="371" y="163" font-family="sans-serif" font-size="16">Signal-derived descriptors</text><text x="371" y="191" font-family="sans-serif" font-size="16">Require quality checks</text><rect x="680" y="65" width="290" height="190" rx="10" fill="#e3efe9"/><text x="696" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Human outcome</text><text x="696" y="135" font-family="sans-serif" font-size="16">Recognized words / keywords</text><text x="696" y="163" font-family="sans-serif" font-size="16">Specified listener + condition</text><text x="696" y="191" font-family="sans-serif" font-size="16">Required for intelligibility</text><text x="30" y="285" font-family="sans-serif" font-size="14" fill="#53646d">Conceptual framework — arrows/integration do not denote an implemented system.</text></svg>
