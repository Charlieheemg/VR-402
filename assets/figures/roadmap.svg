<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img"><title>Evidence gates before feedback claims</title><rect width="1000" height="300" fill="#fff"/><text x="30" y="35" font-family="sans-serif" font-size="22" fill="#193d4a">Evidence gates before feedback claims</text><rect x="30" y="65" width="290" height="190" rx="10" fill="#e2edf1"/><text x="46" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Gate 1 · current</text><text x="46" y="135" font-family="sans-serif" font-size="16">Reproduce measurements</text><text x="46" y="163" font-family="sans-serif" font-size="16">Audit labels and uncertainty</text><text x="46" y="191" font-family="sans-serif" font-size="16">RQ1: descriptive evidence</text><rect x="355" y="65" width="290" height="190" rx="10" fill="#f6eddb"/><text x="371" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Gate 2 · next</text><text x="371" y="135" font-family="sans-serif" font-size="16">Verify human-labelled corpus</text><text x="371" y="163" font-family="sans-serif" font-size="16">Speaker-disjoint evaluation</text><text x="371" y="191" font-family="sans-serif" font-size="16">RQ2: prediction test</text><rect x="680" y="65" width="290" height="190" rx="10" fill="#e3efe9"/><text x="696" y="100" font-family="sans-serif" font-size="18" font-weight="bold">Gate 3 · future</text><text x="696" y="135" font-family="sans-serif" font-size="16">Consent and controlled trial</text><text x="696" y="163" font-family="sans-serif" font-size="16">Recognition + efficiency</text><text x="696" y="191" font-family="sans-serif" font-size="16">RQ3: intervention effect</text><text x="30" y="285" font-family="sans-serif" font-size="14" fill="#53646d">Conceptual framework — arrows/integration do not denote an implemented system.</text></svg>
